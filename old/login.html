<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Login</title>
    <link rel="icon" type="image/png" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        netflix: {
                            red: '#E50914',
                            dark: '#141414',
                            light: '#e5e5e5',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .login-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="bg-black font-sans text-white antialiased login-bg h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full px-4 md:px-12 py-6 flex justify-between items-center">
        <a href="index.html">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" class="w-24 md:w-36"
                alt="Netflix">
        </a>
    </header>

    <!-- Login Form -->
    <div class="flex-grow flex items-center justify-center px-4">
        <div class="bg-black/75 p-8 md:p-16 rounded-lg w-full max-w-[450px] space-y-8">
            <h1 class="text-3xl font-bold mb-8">Sign In</h1>
            <form class="space-y-6"
                onsubmit="event.preventDefault(); document.getElementById('login-error').classList.remove('hidden');">
                <div id="login-error"
                    class="hidden bg-[#e87c03] text-white text-[14px] py-[10px] px-[20px] rounded-[4px] mb-4">
                    Cannot login at the moment. Please try again later.
                </div>
                <div class="relative">
                    <input type="email" placeholder="Email or phone number"
                        class="w-full bg-[#333] rounded px-5 py-4 outline-none focus:bg-[#454545] transition text-white placeholder-gray-500 peer">
                </div>
                <div class="relative">
                    <input type="password" placeholder="Password"
                        class="w-full bg-[#333] rounded px-5 py-4 outline-none focus:bg-[#454545] transition text-white placeholder-gray-500">
                </div>
                <button type="submit"
                    class="w-full bg-[#E50914] text-white font-bold py-4 rounded hover:bg-[#c11119] transition mt-8">Sign
                    In</button>

                <div class="flex justify-between text-sm text-[#b3b3b3] mt-2">
                    <div class="flex items-center gap-1">
                        <input type="checkbox" id="remember" class="accent-[#737373] h-4 w-4">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="hover:underline">Need help?</a>
                </div>
            </form>

            <div class="text-[#737373] mt-16 space-y-4">
                <div class="text-base">
                    New to Netflix? <a href="signup.html" class="text-white hover:underline">Sign up now.</a>
                </div>
                <div class="text-xs text-[#8c8c8c] leading-tight">
                    This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#"
                        class="text-blue-500 hover:underline">Learn more.</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black/75 w-full py-8 mt-auto border-t border-gray-800">
        <div class="max-w-[1000px] mx-auto px-4 md:px-12 text-[#737373] text-sm">
            <div class="mb-4">contact@example.com</div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <a href="#" class="hover:underline">FAQ</a>
                <a href="#" class="hover:underline">Help Center</a>
                <a href="#" class="hover:underline">Terms of Use</a>
                <a href="#" class="hover:underline">Privacy</a>
                <a href="#" class="hover:underline">Cookie Preferences</a>
                <a href="#" class="hover:underline">Corporate Information</a>
            </div>
        </div>
    </footer>

</body>

</html>
